"$schema" = "https://pixi.sh/latest/schema/manifest/schema.json"

[workspace]
name = "meso-forge-packages"
version = "0.1.0"
description = "Domain-specific conda packages for meso-forge"
authors = ["meso-forge maintainers"]
channels = [
    "conda-forge",
    "https://prefix.dev/meso-forge",
    # "s3://pixi-local/meso-forge",
    "http://localhost:19000/pixi-local/meso-forge",
]

platforms = [
    "linux-64",
    "linux-aarch64",
    # "wasi-wasm32",
    # "osx-arm64",
    # "win-64",
    # "osx-64",
]

[dependencies]
# Core dependency on meso-forge-tooling
meso-forge = ">=0.3.5,<0.4.0"

# Build tasks using meso-forge tooling
[tasks.build-all]
cmd = ["meso-forge-build-all"]
description = "Build all packages in this domain"

[tasks.build]
args = [
    { arg = "package" },
    { arg = "dry_run", default = "" },
    { arg = "verbose", default = "" },
    { arg = "force", default = "" },
]
# cmd = ["meso-forge-build-single", "--recipe", "pkgs/{{ package }}/recipe.yaml"]
cmd = [
    "nu",
    ".pixi/envs/default/share/meso-forge/scripts/build_single.nu",
    "--recipe",
    "pkgs/{{ package }}/recipe.yaml",
    "{{ '--dry-run' if dry_run != '' else '' }}",
    "{{ '--verbose' if verbose != '' else '' }}",
    "{{ '--force' if force != '' else '' }}",
]
description = "Build a specific package"

[tasks.build-noarch]
cmd = ["meso-forge-build-noarch"]
description = "Build noarch packages only"

[tasks.build-platform]
cmd = ["meso-forge-build-platform"]
description = "Build platform-specific packages"

[tasks.publish]
args = [
    { arg = "force", default = "" },
    { arg = "channel", default = "meso-forge" },
]
cmd = [
    "meso-forge.nu",
    "publish-pd",
    "--channel",
    "{{ channel }}",
    "{{ '--force' if force != '' else '' }}",
]
description = "Publish packages to prefix.dev"

[tasks.publish-pd]
args = [
    { arg = "force", default = "" },
    { arg = "channel", default = "meso-forge" },
]
cmd = [
    "meso-forge.nu",
    "publish-pd",
    "--channel",
    "{{ channel }}",
    "{{ '--force' if force != '' else '' }}",
]
description = "Publish packages to prefix.dev"

[tasks.publish-s3]
args = [
    { arg = "force", default = "" },
    { arg = "channel", default = "s3://pixi/meso-forge" },
    { arg = "url", default = "https://minio.isis.vanderbilt.edu" },
]
cmd = [
    "meso-forge.nu",
    "publish-s3",
    "--channel",
    "{{ channel }}",
    "--url",
    "{{ url }}",
    "{{ '--force' if force != '' else '' }}",
]
description = "Publish packages to S3"

[tasks.publish-local]
args = [
    { arg = "force", default = "" },
    { arg = "dryrun", default = "" },
    { arg = "verbose", default = "" },
]
cmd = [
    "meso-forge-publish-local",
    "{{ force }}",
    "{{ dryrun }}",
    "{{ verbose }}",
]
description = "Publish packages to local MinIO"

[tasks.index-s3]
args = [
    { arg = "url", default = "https://minio.isis.vanderbilt.edu" },
    { arg = "channel", default = "s3://pixi/meso-forge" },
]
cmd = [
    "rattler-index",
    "s3",
    "{{ channel }}",
    "--region",
    "auto",
    "--endpoint-url",
    "{{ url }}",
    "--force-path-style",
    "true",
    "||",
    "true",
]

[tasks.index-local]
depends-on = [
    { task = "index-s3", args = [
        "http://localhost:19000",
        "s3://pixi-local/meso-forge",
    ] },
]

[tasks.test]
cmd = ["meso-forge.nu", "test"]
description = "Test built packages"

[tasks.lint]
cmd = ["meso-forge.nu", "lint"]
description = "Lint and validate recipes"

[tasks.clean]
cmd = "rm -rf output/"
description = "Clean build artifacts"

[tasks.new-package]
args = [
    { arg = "type", default = "_skeleton_python" },
    { arg = "name", default = "a_new_name" },
]
cmd = ["meso-forge.nu", "init-package", "{{ type }}", "{{ name }}"]
description = "Create new package from skeleton"

[tasks.update-versions]
cmd = ["meso-forge.nu", "version-update", "--each"]
description = "Update all package versions"

[tasks.update-version]
args = [{ arg = "package" }]
cmd = ["meso-forge.nu", "version-update", "--package", "{{ package }}"]
description = "Update specific package version"

[tasks.analyze]
cmd = [
    "python",
    ".pixi/envs/default/share/meso-forge-tooling/scripts/analyze_recipes.py",
    "--base-dir",
    ".",
]
description = "Analyze recipes for issues"

[tasks.pixi-analyze]
cmd = [
    "nu",
    "-c",
    "use (.pixi/envs/default/share/meso-forge-tooling/scripts/pixi_tasks_mod.nu); analyze_tasks pixi.toml false false",
]
description = "Analyze pixi tasks (workaround for pixi-tasks)"

# Environment for this package branch
[environments]
default = { solve-group = "default" }
