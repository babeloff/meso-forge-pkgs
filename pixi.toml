"$schema" = "https://pixi.sh/latest/schema/manifest/schema.json"

[workspace]
name = "meso-forge-packages"
version = "0.1.0"
description = "Management tools for meso-forge domain-specific conda packages"
authors = ["meso-forge maintainers"]
channels = ["conda-forge"]

platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
# Minimal dependencies for management tasks
nushell = "*"
git = "*"

[tasks.catalog-packages]
cmd = ["nu", "scripts/catalog-packages.nu"]
description = "Generate PACKAGES.adoc catalog from all domain packages"

[tasks.new-domain]
args = [
    { arg = "domain_name" },
    { arg = "content_description", default = "domain-specific" },
    { arg = "list_of_packages", default = "TBD" },
]
cmd = [
    "nu",
    "scripts/new-domain.nu",
    "{{ domain_name }}",
    "{{ content_description }}",
    "{{ list_of_packages }}",
]
description = "Create new domain branch (pkgs/<domain-name>) with template files and pkgs directory"

[tasks.publish-domain]
args = [{ arg = "domain_name" }]
cmd = ["nu", "scripts/publish-domains.nu", "--domain", "{{ domain_name }}"]
description = "Push specific domain branch to remote and remove worktree on success"

[tasks.publish-domains]
cmd = ["nu", "scripts/publish-domains.nu"]
description = "Publish all domain worktrees to remote and remove them on success"

[tasks.publish-domains-dry-run]
cmd = ["nu", "scripts/publish-domains.nu", "--dry-run"]
description = "Show what domain worktrees would be published (dry run)"

[tasks.list-worktrees]
cmd = ["git", "worktree", "list"]
description = "List all active Git worktrees"

# Environment for management branch
[environments]
default = { solve-group = "default" }
